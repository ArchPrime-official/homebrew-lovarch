name: brew test-bot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-bot:
    name: brew install + test (macos-latest)
    runs-on: macos-latest

    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ runner.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ runner.os }}-rubygems-

      - name: Install Bundler RubyGems
        run: brew install-bundler-gems

      - uses: actions/checkout@v4

      - name: Symlink this checkout as a brew tap
        run: |
          tap_root="$(brew --repository)/Library/Taps/archprime-official"
          mkdir -p "$tap_root"
          ln -s "$GITHUB_WORKSPACE" "$tap_root/homebrew-lovarch"
          brew tap-info archprime-official/lovarch

      - name: brew style
        run: brew style archprime-official/lovarch/lovarch-cli

      - name: brew install (build from source)
        run: brew install --verbose --build-from-source archprime-official/lovarch/lovarch-cli

      - name: brew test
        run: brew test archprime-official/lovarch/lovarch-cli

      - name: brew audit (informational, non-blocking)
        run: brew audit --tap=archprime-official/lovarch lovarch-cli || true
